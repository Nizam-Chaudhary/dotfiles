tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_align           left
tab_bar_min_tabs        2
tab_bar_margin_width    0.0
tab_bar_margin_height   2.5 1.5

# base background (terminal-like)
tab_bar_margin_color    #232A2E
tab_bar_background      #232A2E

# active tab (subtle highlight, not loud)
active_tab_foreground   #D3C6AA
active_tab_background   #374145
active_tab_font_style   bold

# inactive tabs (muted)
inactive_tab_foreground #9DA9A0
inactive_tab_background #232A2E
inactive_tab_font_style normal

# activity indicator
tab_activity_symbol     " ● "

# title styling (Everforest accents)
tab_title_template      "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title[:30]}{title[30:] and '…'} [{index}]"
active_tab_title_template "{fmt.fg.orange}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title[:30]}{title[30:] and '…'} [{index}]"
