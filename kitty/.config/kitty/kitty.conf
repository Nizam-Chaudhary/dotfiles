
# --- Theme (loads first, then we override tab colors) ---
include ./themes/catppuccin-mocha.conf

# --- Font ---
font_family CaskaydiaCove Nerd Font Mono
# bold_font CaskaydiaCove Nerd Font Mono Bold
# italic_font CaskaydiaCove Nerd Font Mono Italic
# bold_italic_font CaskaydiaCove Nerd Font Mono Bold Italic
font_size 15.0
text_composition_strategy 1.0 0

# Increase vertical spacing between lines
modify_font cell_height 120%

# Optional: increase horizontal spacing between characters
# modify_font cell_width 105%

# Add extra space around the terminal content
window_padding_width 8

# --- Window & Layout ---
# hide_window_decorations yes
wayland_titlebar_color #1e1e2e
confirm_os_window_close 0
background_opacity 0.95
background_blur 32
window_padding_width 12
# remember_window_size yes
# initial_window_width 640
# initial_window_height 400

# --- Cursor ---
cursor_shape block
cursor_blink_interval 0
enable_audio_bell no

# --- Terminal features ---
shell_integration enabled
shell_integration no-cursor
copy_on_select yes
strip_trailing_spaces smart

# # --- Tab Bar Design (ROUNDED) ---
# tab_bar_edge bottom
# tab_bar_style powerline
# tab_powerline_style round
# tab_bar_margin_width 9.0
# tab_bar_margin_height 9.0 0.0
# tab_bar_background #1e1e2e
include ./themes/tabs.conf

# --- Tab Title Templates ---
# tab_title_template "{index}: {tab.active_wd.split('/')[-1]}"
# active_tab_title_template "{index}: {tab.active_wd.split('/')[-1]}"

# --- Performance & Behavior ---
repaint_delay 10
input_delay 3
sync_to_monitor yes
detect_urls yes

# --- Keybindings ---
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
map ctrl+shift+n new_window

# --- Remote Control ---
allow_remote_control yes

# Open a new window (pane) in the current directory
map ctrl+shift+enter launch --cwd=current

# Optional: Open a new tab in the current directory
map ctrl+shift+t launch --cwd=current --type=tab
